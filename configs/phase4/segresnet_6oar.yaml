# Phase 4 - 6 OAR (poumons G/D, coeur, oesophage, moelle epiniere, aorte), cohorte D115.
# Copie de configs/ablation/e2_segresnet.yaml : seuls data.root, label_filename, num_classes, class_names et out_channels changent.
# Lancer avec : --model segresnet --config configs/phase4/segresnet_6oar.yaml --seed <graine> --tag <tag>

# Configuration centrale du projet MRgRT-Seg
experiment:
  name: "unet_vs_segresnet_mrgrt"
  seed: 42
  output_dir: "runs/"

data:
  root: "data6/"            # cree par la cellule Kaggle (image du dataset D187 + label 6 OAR)
  image_filename: "image.nii"
  label_filename: "label.nii.gz"
  num_classes: 7
  class_names: ["background", "poumon_g", "poumon_d", "coeur", "oesophage", "moelle", "aorte"]
  modality: "mri"
  spacing: [1.5, 1.5, 3.0]
  intensity_params:
    clip_percentiles: [0.5, 99.5]
  patch_size: [128, 128, 64]
  cache_rate: 0.5

splits:
  n_folds: 5
  shuffle: true
  seed: 42            # graine des plis, decouplee de la graine d'entrainement (--seed)

model:
  name: "unet"
  in_channels: 1
  out_channels: 7
  features: [32, 64, 128, 256, 512]
  segresnet:
    init_filters: 32
    blocks_down: [1, 2, 2, 4]
    blocks_up:   [1, 1, 1]
    dropout_prob: 0.2

train:
  epochs: 150          # 150 imposees sur Kaggle pour E2 (phase 2)
  batch_size: 2
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 30
  val_interval: 1
  loss:
    name: "dice_ce"
    dice_weight: 1.0
    ce_weight: 1.0
    include_background: false

eval:
  metrics: ["dsc", "iou", "hd95"]
  surface_dsc_tolerance_mm: 2.0
  sliding_window_overlap: 0.5
  test_time_augmentation: false

logging:
  use_wandb: false
  project: "mrgrt-seg"

xai:
  target_layer: "auto"
  metrics: ["in_organ_ratio", "pointing_accuracy", "spatial_entropy"]
  sanity_checks: true
